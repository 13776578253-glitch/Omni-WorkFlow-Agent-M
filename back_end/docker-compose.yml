version: "3.9"

services:

  db:
    image: postgres:15
    container_name: zhilian_db
    restart: always
    environment:
      POSTGRES_USER: zhilian
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: zhilian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma
    container_name: zhilian_chroma
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhilian_backend
    restart: always
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://zhilian:123456@db:5432/zhilian_db
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    depends_on:
      - db
      - chroma
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  chroma_data: